var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],

<style>
  :root {
    --paper: #FAF8F3;
    --ink: #18181b;

    --amber: #b45309;

  .app { display: flex; min-height: 100vh; }

  /* Sidebar */

  .sidebar-header { padding: 20px; border-bottom: 1px solid #3f3f46; }
  .sidebar-header h1 { font-size: 18px; color: #fff; line-height: 1.3; cursor: text; }
  .sidebar-header input { width: 100%; background: #27272a; border: 1px solid #52525b; color: #fff; padding: 5px 8px; font-size: 16px; font-family: Georgia, serif; }
  .sidebar-header p { font-size: 11px; color: #71717a; margin-top: 6px; }
  .nav { flex: 1; padding: 10px 0; overflow-y: auto; }
  .nav button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; color: #d4d4d8; padding: 9px 20px; font-size: 13.5px; text-align: left; border-right: 2px solid transparent; }
  .nav button:hover { background: rgba(255,255,255,0.05); }
  .nav button.active { background: #27272a; color: #fbbf24; border-right-color: #d97706; }
  .nav button svg { flex-shrink: 0; }
  .session-pill { margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; background: #27272a; border: 1px solid #52525b; color: #fbbf24; font-size: 11px; padding: 5px 10px; border-radius: 12px; }
  .session-pill:hover { border-color: #d97706; }
  .branch-pill { margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; background: #1c3d2e; border: 1px solid #2f6f5e; color: #6ee7b7; font-size: 11px; padding: 5px 10px; border-radius: 12px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #18181b 0%, #27272a 60%, #3f2f13 140%); padding: 20px; }
  .login-card { width: 100%; max-width: 360px; background: #FAF8F3; border: 1px solid #d4d4d8; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
  .login-title { font-size: 22px; text-align: center; margin-bottom: 2px; }
  .login-sub { text-align: center; font-size: 12.5px; color: #71717a; margin: 0 0 20px; }
  .login-error { background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; font-size: 12.5px; padding: 8px 10px; margin-bottom: 12px; }
  .sidebar-footer { border-top: 1px solid #3f3f46; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .footer-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 1px solid #3f3f46; color: #a1a1aa; padding: 8px 10px; font-size: 12px; }
  .footer-btn:hover { background: #27272a; color: #fbbf24; border-color: #52525b; }

  /* Mobile top bar */

  .mobile-nav button.active { color: #fbbf24; }

  /* Main */
  .main { flex: 1; padding: 28px; min-width: 0; }

  .main-header-brand-sub { font-size: 10.5px; color: #a1a1aa; white-space: nowrap; }
  .main-header-divider { width: 1px; height: 26px; background: var(--line); flex-shrink: 0; }

  .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--line); margin-bottom: 28px; }
  .stat-cell { background: #fff; padding: 16px; border-right: 1px solid var(--line); }

  .stat-cell .label { font-size: 11.5px; color: #71717a; margin-top: 4px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }

  .panel-head h3 { font-size: 15px; }
  .panel-body-pad { padding: 16px; }
  .muted { color: #71717a; font-size: 13px; padding: 16px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #71717a; font-weight: 500; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  table td { padding: 8px 16px; border-bottom: 1px solid var(--line-light); }
  table tr:last-child td { border-bottom: none; }
  table td.right, table th.right { text-align: right; }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; font-size: 11px; border: 1px solid; white-space: nowrap; }
  .badge.zinc { background: #f4f4f5; color: #3f3f46; border-color: #d4d4d8; }
  .badge.emerald { background: var(--emerald-bg); color: var(--emerald); border-color: #a7f3d0; }
  .badge.rose { background: var(--rose-bg); color: var(--rose); border-color: #fecdd3; }
  .badge.amber { background: var(--amber-bg); color: var(--amber); border-color: #fde68a; }
  .badge.sky { background: var(--sky-bg); color: var(--sky); border-color: #bae6fd; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .btn:hover { background: #f4f4f5; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #fff; }
  .btn.primary:hover { background: #92400e; }
  .btn.danger { background: var(--rose); border-color: var(--rose); color: #fff; }
  .btn.danger:hover { background: #9f1239; }

  .icon-btn:hover { color: var(--amber); }
  .icon-btn.danger-hover:hover { color: var(--rose); }

  .field { display: block; margin-bottom: 12px; }

  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: #fff; padding: 8px 10px; font-size: 14px; }
  .field textarea { resize: vertical; min-height: 44px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid #f59e0b; outline-offset: -1px; }

  .search-wrap { position: relative; width: 280px; max-width: 100%; }
  .search-wrap svg { position: absolute; left: 10px; top: 10px; color: #a1a1aa; }
  .search-wrap input { width: 100%; border: 1px solid var(--line); padding: 8px 10px 8px 32px; font-size: 14px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .subtabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .subtabs button { padding: 7px 14px; font-size: 13px; border: 1px solid var(--line); background: #fff; color: #52525b; }
  .subtabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .overlay { position: fixed; inset: 0; background: rgba(24,24,27,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
  .modal { width: 100%; max-width: 460px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
  .modal.wide { max-width: 640px; }

  .modal-body { padding: 18px 20px; max-height: 76vh; overflow-y: auto; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 6px; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .form-section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--amber); margin: 14px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .form-section-label:first-child { margin-top: 0; }

  .subject-row { display: grid; grid-template-columns: 1fr 90px 90px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }

  .list-panel { max-height: 460px; overflow-y: auto; }
  .list-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line-light); padding: 9px 16px; font-size: 14px; }
  .list-item:hover { background: #fafafa; }
  .list-item.active { background: var(--amber-bg); }
  .list-item .name { color: var(--ink); }
  .list-item .sub { font-size: 12px; color: #a1a1aa; }

  .avatar { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: Georgia, serif; }
  .avatar.lg { width: 64px; height: 64px; font-size: 22px; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 28px; padding: 16px; border: 1px solid var(--line); background: #fff; margin-bottom: 16px; }
  .stat-row .item span.label { display: block; font-size: 11px; text-transform: uppercase; color: #71717a; }
  .stat-row .item span.value { font-family: Georgia, serif; font-size: 20px; }

  .payment-form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; }

  .result-card, .certificate-preview { border: 2px solid var(--ink); background: #fff; padding: 24px; }
  .idcard { width: 340px; aspect-ratio: 1.586/1; margin: 0 auto; background: #fff; border: 1px solid #d4d4d8; box-shadow: 0 6px 18px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, Arial, sans-serif; }
  .idcard-head { background: linear-gradient(120deg, #18181b 0%, #3f2f13 60%, #b45309 130%); color: #fff; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
  .idcard-logo { width: 24px; height: 24px; object-fit: contain; background: #fff; border-radius: 3px; padding: 1px; flex-shrink: 0; }
  .idcard-head .org { font-family: Georgia, serif; font-size: 11px; font-weight: bold; line-height: 1.2; }
  .idcard-head .sub { font-size: 8px; opacity: 0.85; }
  .idcard-body { flex: 1; display: flex; padding: 8px 10px; gap: 8px; align-items: center; }
  .idcard-photo { width: 64px; height: 78px; border: 1px solid #d4d4d8; background: #f4f4f5; flex-shrink: 0; overflow: hidden; }
  .idcard-photo img { width: 100%; height: 100%; object-fit: cover; }
  .idcard-photo .ph-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 22px; color: #fff; }
  .idcard-fields { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.5px; min-width: 0; }
  .idcard-qr { flex-shrink: 0; }
  .idcard-name { font-family: Georgia, serif; font-size: 12.5px; font-weight: bold; color: #18181b; margin-bottom: 2px; }
  .idcard-line { display: flex; font-size: 8px; color: #3f3f46; gap: 3px; }
  .idcard-line b { color: #71717a; font-weight: 600; min-width: 42px; }
  .idcard-foot { border-top: 1px dashed #d4d4d8; padding: 4px 10px 6px; display: flex; justify-content: space-between; align-items: flex-end; }
  .idcard-foot .regno { font-size: 8px; font-weight: bold; letter-spacing: 0.03em; color: #b45309; }
  .idcard-foot .sig { font-size: 7px; color: #71717a; text-align: right; }
  .idcard-barcode { height: 14px; background: repeating-linear-gradient(90deg, #18181b 0px, #18181b 1.5px, transparent 1.5px, transparent 3px); margin: 3px 10px 0; opacity: 0.85; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #71717a; background: none; border: none; margin-bottom: 16px; padding: 0; }
  .back-link:hover { color: var(--amber); }
  .rc-title, .card-title { text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
  .rc-title h3, .card-title h3 { font-size: 20px; }
  .rc-title p, .card-title p { font-size: 12px; color: #71717a; margin-top: 4px; }
  .rc-meta { display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; margin-bottom: 16px; }
  .rc-meta span.lbl { color: #71717a; }
  .rc-footer { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }

  a.link-btn { font-size: 12px; color: var(--amber); text-decoration: none; cursor: pointer; }
  a.link-btn:hover { text-decoration: underline; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 24px; padding: 16px; }
  .info-grid .info-item { padding: 8px 0; border-bottom: 1px solid var(--line-light); }
  .info-grid .info-item.full { grid-column: 1 / -1; }
  .info-grid .info-item .lbl { display: block; font-size: 11px; text-transform: uppercase; color: #71717a; letter-spacing: 0.03em; }
  .info-grid .info-item .val { font-size: 14px; margin-top: 2px; }

  .detail-header { display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid var(--line); background: #fff; margin-bottom: 16px; flex-wrap: wrap; }
  .detail-header .meta h3 { font-size: 20px; }
  .detail-header .meta p { font-size: 13px; color: #71717a; margin-top: 2px; }
  .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

  .empty-state { text-align: center; padding: 40px 20px; color: #a1a1aa; }
  .empty-state svg { margin-bottom: 10px; opacity: 0.6; }
  .empty-state p { font-size: 13px; }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    .mobile-bar { display: flex; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .form-grid-2 { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .main { padding: 16px; }
    .payment-form-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="loginRoot" class="login-wrap" style="display:none;">
  <div class="login-card">
    <div id="loginLogoWrap" style="text-align:center; margin-bottom:10px; display:none;"><img id="loginLogo" style="width:56px;height:56px;object-fit:contain;" /></div>
    <h1 class="login-title" id="loginInstituteName">Student Register</h1>
    <p class="login-sub">Sign in to your branch portal</p>
    <div class="field">
      <span>Branch</span>
      <select id="loginBranch">
        <option value="__admin__">Admin (all branches)</option>
      </select>
    </div>
    <div class="field"><span>Username</span><input id="loginUsername" autocomplete="username" /></div>
    <div class="field"><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter') attemptLogin()" /></div>
    <p id="loginError" class="login-error" style="display:none;">Incorrect username or password for this branch.</p>
    <button class="btn primary" style="width:100%; justify-content:center; padding:10px;" onclick="attemptLogin()">Login</button>
    <p id="loginLicenseNote" class="muted" style="text-align:center; padding-top:14px; display:none;"></p>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 id="instituteTitle" onclick="startEditName()">Student Register</h1>
      <input id="instituteInput" style="display:none" onblur="saveName()" onkeydown="if(event.key==='Enter') this.blur()" />

      <button class="session-pill" id="sessionPill" onclick="openSessionModal()">Session: <span id="sessionPillLabel">—</span></button>
      <button class="branch-pill" id="branchPill" onclick="openMyProfileModal()" style="cursor:pointer; border:none; text-align:left;">—</button>

          Import backup

        </button>
      </div>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>

  <div style="flex:1; min-width:0;">
    <div class="mobile-bar">
      <h1 id="instituteTitleMobile">Student Register</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="icon-btn" style="color:#fff" title="Export backup" onclick="exportData()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

        </button>

    </div>

    <div class="main">

        <div class="main-header-brand">

        <span class="date" id="todayDate"></span>
      </div>
      <div id="mainContent"></div>
    </div>
  </div>
</div>

/* ---------- Crypto helpers (password hashing + backup encryption) ---------- */
const CRYPTO_AVAILABLE = !!(window.crypto && window.crypto.subtle);
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function randomHex(bytes) {
  return Array.from(crypto.getRandomValues(new Uint8Array(bytes))).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPassword(password, salt) {
  if (!CRYPTO_AVAILABLE) return password; // fallback: unhashed, only on browsers without Web Crypto
  return sha256Hex(salt + ':' + password);
}
async function verifyPassword(password, salt, hash) {
  if (!CRYPTO_AVAILABLE) return password === hash;
  return (await hashPassword(password, salt)) === hash;
}
function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
async function deriveAesKey(password, saltBytes) {
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 150000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptBackupJSON(jsonStr, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt);
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(jsonStr));
  return JSON.stringify({ smsBackup: true, v: 1, enc: 'AES-GCM', salt: bufToB64(salt), iv: bufToB64(iv), data: bufToB64(cipherBuf) });
}
async function decryptBackupJSON(envelopeStr, password) {
  const env = JSON.parse(envelopeStr);
  if (!env || !env.smsBackup || !env.data) throw new Error('not-encrypted-envelope');
  const key = await deriveAesKey(password, b64ToBuf(env.salt));
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(env.iv) }, key, b64ToBuf(env.data));
  return new TextDecoder().decode(plainBuf);
}
function isEncryptedEnvelope(str) {
  try { const o = JSON.parse(str); return !!(o && o.smsBackup && o.data); } catch { return false; }
}

const QR_LIB_AVAILABLE = typeof window.qrcode === 'function';
function studentQrText(s) {

function qrDataUrl(text, cellSize) {
  if (!QR_LIB_AVAILABLE) return '';
  try {
    const qr = window.qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    // margin of 4 modules is the minimum "quiet zone" real QR scanners need — 0 here
    // produces codes that generate fine but fail to scan with phone cameras.
    return qr.createDataURL(cellSize || 4, 4);
  } catch { return ''; }
}
function qrImgHtml(s, sizePx, cellSize) {

}

/* ---------- Sessions ---------- */
function sessionLabelForDate(d) {
  const dt = d ? new Date(d) : new Date();
  const y = dt.getMonth() >= 3 ? dt.getFullYear() : dt.getFullYear() - 1; // Apr–Mar session
  return `${y}-${String((y + 1) % 100).padStart(2, '0')}`;
}
function ensureCurrentSession() {
  const label = sessionLabelForDate();
  if (!state.sessions.find(s => s.label === label)) {
    state.sessions.push({ id: uid(), label });
    persistSessions();
  }
  if (!state.currentSessionId || !state.sessions.find(s => s.id === state.currentSessionId)) {
    const match = state.sessions.find(s => s.label === label);
    state.currentSessionId = match ? match.id : (state.sessions[0] && state.sessions[0].id) || '';
    saveKey(KEYS.settings, { instituteName: state.instituteName, currentSessionId: state.currentSessionId });
  }
}
function currentSession() { return state.sessions.find(s => s.id === state.currentSessionId) || state.sessions[0] || { label: sessionLabelForDate() }; }

function generateRegNo(sessionLabel) {
  const count = state.students.filter(s => s.session === sessionLabel).length;

}

/* ---------- Discount & net fee ---------- */
function discountAmountFor(student) {
  const total = Number(student.totalFee || 0);
  if (student.discountType === 'percent') return Math.round(total * (Number(student.discountValue || 0) / 100));
  return Number(student.discountValue || 0);
}
function netFeeFor(student) { return Math.max(0, Number(student.totalFee || 0) - discountAmountFor(student)); }
function dueFor(student) { return netFeeFor(student) - paidFor(student.id); }

/* ---------- Course duration / completion ---------- */
function parseDurationMonths(str) {
  const s = String(str || '').toLowerCase();
  const m = s.match(/(\d+(?:\.\d+)?)\s*(year|yr|month|mo|week|wk|day)/);
  if (!m) return null;
  const n = parseFloat(m[1]);
  const unit = m[2];
  if (unit.startsWith('year') || unit === 'yr') return n * 12;
  if (unit.startsWith('month') || unit === 'mo') return n;
  if (unit.startsWith('week') || unit === 'wk') return n / 4.345;
  if (unit.startsWith('day')) return n / 30.44;
  return null;
}
function expectedCompletionDate(student) {
  const course = state.courses.find(c => c.name === student.course);
  const months = course ? parseDurationMonths(course.duration) : null;
  if (!months || !student.admissionDate) return null;
  const d = new Date(student.admissionDate);
  d.setDate(d.getDate() + Math.round(months * 30.44));
  return d.toISOString().slice(0, 10);
}
function isCompletionDue(student) {
  if (student.status === 'inactive' || student.completionDate) return false;
  const exp = expectedCompletionDate(student);
  return !!exp && exp <= todayStr();
}

async function loadKey(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
    return fallback;
  } catch { return fallback; }
}
async function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}

    loadKey(KEYS.students, []),
    loadKey(KEYS.courses, []),
    loadKey(KEYS.settings, { instituteName: 'Student Register', currentSessionId: '' }),
    loadKey(KEYS.attendance, {}),
    loadKey(KEYS.fees, {}),
    loadKey(KEYS.results, {}),
    loadKey(KEYS.feeTypes, []),
    loadKey(KEYS.feeGroups, []),
    loadKey(KEYS.certTemplates, DEFAULT_CERT_TEMPLATES),
    loadKey(KEYS.centers, []),
    loadKey(KEYS.sessions, []),
    loadKey(KEYS.adminAuth, null),
    loadKey(KEYS.brand, null),
    loadKey(KEYS.activityLog, []),
  ]);
  state.courses = courses;
  state.instituteName = settings.instituteName || 'Student Register';
  state.attendance = attendance;
  state.fees = fees;
  state.results = results;
  state.feeTypes = feeTypes;
  state.feeGroups = feeGroups;
  state.certTemplates = { completion: { ...DEFAULT_CERT_TEMPLATES.completion, ...(certTemplates.completion||{}) }, merit: { ...DEFAULT_CERT_TEMPLATES.merit, ...(certTemplates.merit||{}) } };
  state.centers = centers;
  state.sessions = sessions;
  state.currentSessionId = settings.currentSessionId || '';
  state.adminAuth = adminAuth || state.adminAuth;
  state.brand = brand ? { ...DEFAULT_BRAND, ...brand } : { ...DEFAULT_BRAND };
  state.brand.name = state.instituteName;
  state.activityLog = activityLog || [];
  ensureCurrentSession();

  // Seed the three known branches on first run, with hashed passwords from the start.
  if (state.centers.length === 0) {
    const seed = [
      { name: 'Bal Bhawan', location: 'Model Town, Near Shiv Chowk, Rewari, Haryana 123401', username: 'balbhawan', password: 'balbhawan123' },
      { name: 'Children Home, Astha Kunj', location: 'Rewari, Haryana', username: 'asthakunj', password: 'asthakunj123' },
      { name: 'Kosli Branch', location: 'Kosli, Haryana', username: 'kosli', password: 'kosli123' },
    ];
    state.centers = [];
    for (const s of seed) {
      const salt = randomHex(8);
      const hash = await hashPassword(s.password, salt);
      state.centers.push({ id: uid(), name: s.name, location: s.location, username: s.username, salt, hash, operatorName: '' });
    }
    persistCenters();
  }

  // Migrate any legacy plaintext passwords (admin + branches) to salted hashes.
  if (state.adminAuth.password !== undefined) {
    const salt = randomHex(8);
    const hash = await hashPassword(state.adminAuth.password, salt);
    state.adminAuth = { username: state.adminAuth.username, salt, hash };
    saveKey(KEYS.adminAuth, state.adminAuth);
  }
  let centersMigrated = false;
  for (const c of state.centers) {
    if (c.password !== undefined) {
      c.salt = randomHex(8);
      c.hash = await hashPassword(c.password, c.salt);
      delete c.password;
      centersMigrated = true;
    }
    if (c.operatorName === undefined) { c.operatorName = ''; centersMigrated = true; }
  }
  if (centersMigrated) persistCenters();

  state.students = students.map(s => ({
    dob:'', gender:'', bloodGroup:'', email:'', address:'', fatherName:'', motherName:'', photoUrl:'',
    aadharNo:'', qualification:'', altContact:'', status:'active', disableReason:'', disableDate:'',
    finalGrade:'', completionDate:'', feeGroupId:'', courseHistory:[],
    centers: [], discountType: 'flat', discountValue: 0, regNo: '', session: '',
    ...s,
    fatherName: s.fatherName || s.guardianName || '',
    centers: Array.isArray(s.centers) ? s.centers : (s.centers ? [s.centers] : []),
  }));
  // Backfill session + regNo for students created before this feature existed,
  // ordered by admission date so numbering stays sequential per session.
  const needsBackfill = state.students.filter(s => !s.regNo);
  if (needsBackfill.length) {
    needsBackfill
      .slice()
      .sort((a, b) => new Date(a.admissionDate || 0) - new Date(b.admissionDate || 0))
      .forEach(s => {
        s.session = s.session || sessionLabelForDate(s.admissionDate);
        s.regNo = generateRegNo(s.session);
      });
    persistStudents();
  }

  document.getElementById('loginInstituteName').textContent = state.instituteName;

  const savedSession = await loadKey(KEYS.session, null);
  const sessionValid = savedSession === 'admin' || (savedSession && state.centers.find(c => c.id === savedSession));
  if (sessionValid) {
    state.currentBranch = savedSession;
    state.currentUsername = savedSession === 'admin' ? state.adminAuth.username : (state.centers.find(c=>c.id===savedSession)?.username || '');
    state.lastActivityAt = Date.now();
    if (savedSession === 'admin') state.tab = 'allbranches';
    showApp();
  } else {
    showLogin();
  }
  registerAutoBackup();
  registerSessionTimeout();
}

function getLoginLock() {
  try { return JSON.parse(localStorage.getItem(KEYS.loginLock) || 'null') || { count: 0, lockedUntil: 0 }; }
  catch { return { count: 0, lockedUntil: 0 }; }
}
function setLoginLock(lock) { localStorage.setItem(KEYS.loginLock, JSON.stringify(lock)); }
async function attemptLogin() {
  const lock = getLoginLock();
  if (lock.lockedUntil && Date.now() < lock.lockedUntil) {
    const secs = Math.ceil((lock.lockedUntil - Date.now()) / 1000);
    document.getElementById('loginError').textContent = `Too many failed attempts. Try again in ${secs}s.`;
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  const branchVal = document.getElementById('loginBranch').value;
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  let ok = false, branchId = null;
  if (branchVal === '__admin__') {
    ok = username === state.adminAuth.username && await verifyPassword(password, state.adminAuth.salt, state.adminAuth.hash);
    branchId = 'admin';
  } else {
    const b = state.centers.find(c => c.id === branchVal);
    if (b) { ok = username === b.username && await verifyPassword(password, b.salt, b.hash); branchId = b.id; }
  }
  if (!ok) {
    const count = (lock.count || 0) + 1;
    const newLock = { count, lockedUntil: count >= 5 ? Date.now() + 60000 : 0 };
    setLoginLock(newLock);
    document.getElementById('loginError').textContent = newLock.lockedUntil
      ? 'Too many failed attempts. Try again in 60s.'
      : 'Incorrect username or password for this branch.';
    document.getElementById('loginError').style.display = 'block';
    logActivity('Login failed', `Username "${username}" on ${branchVal === '__admin__' ? 'Admin' : (state.centers.find(c=>c.id===branchVal)?.name || 'unknown branch')}`, branchVal === '__admin__' ? 'admin' : branchVal, username);
    return;
  }
  setLoginLock({ count: 0, lockedUntil: 0 });
  state.currentBranch = branchId;
  state.currentUsername = username;
  state.lastActivityAt = Date.now();
  state.tab = branchId === 'admin' ? 'allbranches' : 'dashboard';
  saveKey(KEYS.session, branchId);
  logActivity('Login', 'Signed in', branchId, username);
  showApp();
}
function logout() {
  if (!confirm('Log out of this branch portal? An automatic backup will be saved first.')) return;
  logActivity('Logout', 'Signed out');
  autoBackupNow();
  state.currentBranch = null;
  state.currentUsername = '';
  saveKey(KEYS.session, null);
  state.tab = 'dashboard';
  showLogin();
}

/* ---------- Backup password protection ---------- */
let backupPasswordMemory = null; // held only in memory for this tab session — never persisted
function hasBackupPassword() { return !!(state.backupAuth && state.backupAuth.hash); }
async function setBackupPassword(password) {
  const salt = randomHex(8);
  const hash = await hashPassword(password, salt);
  state.backupAuth = { salt, hash };
  saveKey(KEYS.backupAuth, state.backupAuth);
  backupPasswordMemory = password;
}
async function verifyBackupPassword(password) {
  if (!hasBackupPassword()) return true;
  return verifyPassword(password, state.backupAuth.salt, state.backupAuth.hash);
}
function removeBackupPasswordProtection() {
  state.backupAuth = null;
  saveKey(KEYS.backupAuth, null);
  backupPasswordMemory = null;
}
function refreshBackupPasswordStatusUI() {
  const el = document.getElementById('backupPasswordStatus');
  if (el) el.innerHTML = renderBackupPasswordStatusHtml();
}
function renderBackupPasswordStatusHtml() {
  if (!hasBackupPassword()) {
    return `<span class="muted" style="padding:0;">No backup password set — backup files are plain, readable JSON.</span> <button class="btn small" onclick="openSetBackupPasswordModal(false)">Set backup password</button>`;
  }
  if (backupPasswordMemory) {
    return `<span style="color:var(--emerald)">Backup password set and unlocked for this session</span> — new backups are encrypted automatically. <button class="btn small ghost" onclick="openSetBackupPasswordModal(true)">Change</button> <button class="btn small ghost" onclick="openRemoveBackupPasswordModal()">Remove</button>`;
  }
  return `<span style="color:var(--amber)">Backup password set, but locked for this session</span> — automatic backups will save unencrypted until unlocked. <button class="btn small" onclick="openUnlockBackupModal()">Unlock</button> <button class="btn small ghost" onclick="openRemoveBackupPasswordModal()">Remove</button>`;
}

          ${isChange ? `<label class="field"><span>Current backup password</span><input type="password" id="bp_current" /></label>` : ''}
          <label class="field"><span>New backup password</span><input type="password" id="bp_new" autocomplete="new-password" /></label>
          <label class="field"><span>Confirm new backup password</span><input type="password" id="bp_confirm" autocomplete="new-password" /></label>
          <p id="bp_error" class="login-error" style="display:none;"></p>
          <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn primary" onclick="saveBackupPasswordFromModal(${isChange})">Save</button>
          </div>

async function saveBackupPasswordFromModal(isChange) {
  const errEl = document.getElementById('bp_error');
  const showErr = (msg) => { errEl.textContent = msg; errEl.style.display = 'block'; };
  if (isChange) {
    const current = document.getElementById('bp_current').value;
    if (!(await verifyBackupPassword(current))) { showErr('Current backup password is incorrect.'); return; }
  }
  const newPw = document.getElementById('bp_new').value;
  const confirm2 = document.getElementById('bp_confirm').value;
  if (!newPw || newPw.length < 4) { showErr('Password must be at least 4 characters.'); return; }
  if (newPw !== confirm2) { showErr('Passwords do not match.'); return; }
  await setBackupPassword(newPw);
  logActivity('Backup password ' + (isChange ? 'changed' : 'set'), '', 'admin', state.adminAuth.username);
  closeModal();
  refreshBackupPasswordStatusUI();
  alert('Backup password saved and unlocked for this session.');
}

async function unlockBackupFromModal() {

const FS_API_SUPPORTED = typeof window.showDirectoryPicker === 'function';
let backupDirHandleCache = null;
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('sms-backup-db', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch { /* IndexedDB unavailable — folder link simply won't persist across reloads */ }
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } catch { return null; }
}
function suggestedBackupFolderHint() {
  if (location.protocol !== 'file:') return '';
  try {
    const path = decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, '$1');
    const folder = path.substring(0, Math.max(path.lastIndexOf('/'), path.lastIndexOf('\\')));
    return folder;
  } catch { return ''; }
}
async function chooseBackupFolder() {
  if (!FS_API_SUPPORTED) {

    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { alert('Permission was not granted, so backups will not be saved to that folder.'); return; }
    backupDirHandleCache = handle;
    await idbSet('backupDirHandle', handle);
    localStorage.setItem('sms:backupFolderName', handle.name);

  } catch (e) {

  }

async function getBackupDirHandle(promptIfNeeded) {
  if (backupDirHandleCache) return backupDirHandleCache;
  if (!FS_API_SUPPORTED) return null;
  const handle = await idbGet('backupDirHandle');
  if (!handle) return null;
  try {
    let perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted' && promptIfNeeded) perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') { backupDirHandleCache = handle; return handle; }
    return null;
  } catch { return null; }
}
async function writeBackupToFolder(filename, content) {
  const handle = await getBackupDirHandle(false);

  try {
    const dateFolder = todayStr(); // YYYY-MM-DD — keeps each day's backups grouped together
    const dayHandle = await handle.getDirectoryHandle(dateFolder, { create: true });
    const fileHandle = await dayHandle.getFileHandle(filename, { create: true });

    await writable.write(content);
    await writable.close();

  } catch { return false; }
}

  try {

    } else {

      const rollNo = (r[idx.rollNo] || '').trim();
      if (!name || !rollNo) { skipped++; continue; }
      const admissionDate = (idx.admission > -1 && r[idx.admission]) ? r[idx.admission].trim() : todayStr();
      const session = sessionLabelForDate(admissionDate);
      const branchName = idx.branch > -1 ? (r[idx.branch] || '').trim() : '';
      let centers = [];
      if (own) centers = [own.name];
      else if (branchName) {
        const match = state.centers.find(c => c.name.toLowerCase() === branchName.toLowerCase());
        if (match) centers = [match.name];
      }
      const student = {
        id: uid(), regNo: generateRegNo(session), session, rollNo, name,
        fatherName: idx.father > -1 ? (r[idx.father] || '').trim() : '',
        motherName: idx.mother > -1 ? (r[idx.mother] || '').trim() : '',
        course: idx.course > -1 ? (r[idx.course] || '').trim() : '',
        admissionDate,
        totalFee: idx.fee > -1 ? (Number(r[idx.fee]) || 0) : 0,
        contact: idx.contact > -1 ? (r[idx.contact] || '').trim() : '',
        altContact: idx.altContact > -1 ? (r[idx.altContact] || '').trim() : '',
        email: idx.email > -1 ? (r[idx.email] || '').trim() : '',
        dob: idx.dob > -1 ? (r[idx.dob] || '').trim() : '',
        gender: idx.gender > -1 ? (r[idx.gender] || '').trim() : '',
        bloodGroup: idx.blood > -1 ? (r[idx.blood] || '').trim() : '',
        aadharNo: idx.aadhar > -1 ? (r[idx.aadhar] || '').trim() : '',
        qualification: idx.qualification > -1 ? (r[idx.qualification] || '').trim() : '',
        addrStreet: idx.street > -1 ? (r[idx.street] || '').trim() : '',
        addrWard: idx.ward > -1 ? (r[idx.ward] || '').trim() : '',
        addrCity: idx.city > -1 ? (r[idx.city] || '').trim() : '',
        addrDistrict: idx.district > -1 ? (r[idx.district] || '').trim() : '',
        addrState: idx.state > -1 ? (r[idx.state] || '').trim() : '',
        addrPin: idx.pin > -1 ? (r[idx.pin] || '').trim() : '',
        address: '', photoUrl: '', status: 'active', disableReason: '', disableDate: '',
        finalGrade: '', completionDate: '', feeGroupId: '', courseHistory: [],
        centers, discountType: 'flat', discountValue: 0,
      };
      state.students.push(student);
      added++;
    }
    persistStudents();
    logActivity('Students imported from CSV', `${added} added, ${skipped} skipped`);
    render();
    alert(`Import complete: ${added} student(s) added${skipped ? `, ${skipped} row(s) skipped (missing name or roll no.)` : ''}.`);
  };
  reader.readAsText(file);
}

/* ---------- Derived helpers ---------- */
function isAdmin() { return state.currentBranch === 'admin'; }
function currentBranchObj() { return isAdmin() ? null : state.centers.find(c => c.id === state.currentBranch) || null; }
function scopedStudents() {
  if (isAdmin() || !state.currentBranch) return state.students;
  const b = currentBranchObj();
  if (!b) return state.students;
  return state.students.filter(s => (s.centers || []).includes(b.name));
}
function paidFor(studentId) { return (state.fees[studentId] || []).reduce((s, f) => s + Number(f.amount || 0), 0); }
function feeGroupTotal(group) { return (group.items || []).reduce((s, it) => s + Number(it.amount || 0), 0); }
function activeStudents() { return state.ui.showInactive ? scopedStudents() : scopedStudents().filter(s => s.status !== 'inactive'); }
function examStats(ex) {
  const obtained = ex.subjects.reduce((s, sub) => s + Number(sub.obtained || 0), 0);
  const max = ex.subjects.reduce((s, sub) => s + Number(sub.max || 0), 0);
  const pct = max ? Math.round((obtained / max) * 1000) / 10 : 0;
  return { obtained, max, pct, grade: gradeFor(pct), pass: pct >= 33 };
}
function attendanceStatsFor(studentId, from, to) {
  const dates = Object.keys(state.attendance).filter(d => (!from || d >= from) && (!to || d <= to));
  let present = 0, absent = 0;
  dates.forEach(d => {
    const st = state.attendance[d][studentId];
    if (st === 'present') present++;
    else if (st === 'absent') absent++;
  });
  const marked = present + absent;
  const pct = marked ? Math.round((present / marked) * 100) : 0;
  return { present, absent, marked, pct };
}

function renderAllBranches() {
  const rows = state.centers.map(c => {
    const studs = state.students.filter(s => (s.centers||[]).includes(c.name));
    const active = studs.filter(s => s.status !== 'inactive');
    const collected = studs.reduce((sum,s) => sum + paidFor(s.id), 0);
    const pending = studs.reduce((sum,s) => sum + Math.max(0, dueFor(s)), 0);
    const compDue = studs.filter(isCompletionDue).length;
    const today = todayStr();
    const rec = state.attendance[today] || {};
    const presentToday = studs.filter(s => rec[s.id] === 'present').length;
    return { branch: c, total: studs.length, active: active.length, collected, pending, compDue, presentToday };
  });
  const grand = rows.reduce((acc,r) => ({

      <div class="stat-cell"><div class="value" style="color:var(--emerald)">${fmtMoney(grand.collected)}</div><div class="label">Fees collected</div></div>
      <div class="stat-cell"><div class="value" style="color:var(--rose)">${fmtMoney(grand.pending)}</div><div class="label">Fees pending</div></div>
      <div class="stat-cell"><div class="value">${grand.presentToday}</div><div class="label">Present today</div></div>
    </div>
    <div class="panel" style="overflow-x:auto;">
      <table style="min-width:760px;">
        <thead><tr><th>Branch</th><th>Location</th><th>Students</th><th>Active</th><th>Collected</th><th>Pending</th><th>Completion due</th><th>Present today</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td>${esc(r.branch.name)}</td>
            <td style="color:#71717a; font-size:12.5px;">${esc(r.branch.location)||'—'}</td>
            <td>${r.total}</td>
            <td>${r.active}</td>
            <td style="color:var(--emerald)">${fmtMoney(r.collected)}</td>
            <td style="color:var(--rose)">${fmtMoney(r.pending)}</td>
            <td>${r.compDue > 0 ? `<span class="badge amber">${r.compDue}</span>` : '0'}</td>
            <td>${r.presentToday}</td>
          </tr>`).join('')}
          <tr class="totalsrow" style="font-weight:bold; background:#fafaf9;">
            <td colspan="2">Grand total</td><td>${grand.total}</td><td>${grand.active}</td>
            <td style="color:var(--emerald)">${fmtMoney(grand.collected)}</td>
            <td style="color:var(--rose)">${fmtMoney(grand.pending)}</td>
            <td>${grand.compDue}</td><td>${grand.presentToday}</td>

  const newPw = document.getElementById('mp_new').value;

async function saveAdminAuth() {

async function performFactoryReset() {
  const errEl = document.getElementById('resetError');
  const showErr = (msg) => { errEl.textContent = msg; errEl.style.display = 'block'; };
  const pw = document.getElementById('resetAdminPassword').value;
  if (!(await verifyPassword(pw, state.adminAuth.salt, state.adminAuth.hash))) {
    showErr('Incorrect admin password.');
    return;
  }
  if (document.getElementById('resetConfirmInput').value.trim() !== 'RESET') {
    showErr('Please type RESET exactly to confirm.');
    return;
  }
  [KEYS.students, KEYS.courses, KEYS.attendance, KEYS.fees, KEYS.results, KEYS.feeTypes, KEYS.feeGroups,
   KEYS.certTemplates, KEYS.centers, KEYS.sessions, KEYS.activityLog].forEach(k => localStorage.removeItem(k));
  const idx = JSON.parse(localStorage.getItem(KEYS.autobackupIndex) || '[]');
  idx.forEach(k => localStorage.removeItem(k));
  localStorage.removeItem(KEYS.autobackupIndex);
  localStorage.removeItem(KEYS.session);
  closeModal();
  location.reload();
}

  const filterText = (state.ui.logSearch || '').toLowerCase();

  let rows = (state.activityLog || []).slice().reverse();
  if (filterBranch) rows = rows.filter(r => r.branch === filterBranch);
  if (filterFrom) rows = rows.filter(r => r.ts.slice(0,10) >= filterFrom);
  if (filterTo) rows = rows.filter(r => r.ts.slice(0,10) <= filterTo);
  if (filterText) rows = rows.filter(r =>
    r.action.toLowerCase().includes(filterText) ||
    (r.detail||'').toLowerCase().includes(filterText) ||
    (r.username||'').toLowerCase().includes(filterText)
  );
  const shown = rows.slice(0, 300);

  return `
    <p class="muted" style="padding:0 0 14px;">Every login, logout, and data change across all branches — kept for the last ${state.activityLog.length ? 1000 : 0} events. Showing ${shown.length} of ${rows.length} matching entries.</p>
    <div class="toolbar">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <select onchange="state.ui.logFilterBranch=this.value; render()" style="border:1px solid var(--line); padding:7px 8px; font-size:12.5px;">
          <option value="">All branches</option>
          ${branchOptions.map(b => `<option value="${esc(b)}" ${filterBranch===b?'selected':''}>${esc(b)}</option>`).join('')}
        </select>
        <input type="date" value="${filterFrom}" onchange="state.ui.logFrom=this.value; render()" style="border:1px solid var(--line); padding:6px 8px; font-size:12.5px;" />
        <span class="muted" style="padding:0;">to</span>
        <input type="date" value="${filterTo}" onchange="state.ui.logTo=this.value; render()" style="border:1px solid var(--line); padding:6px 8px; font-size:12.5px;" />
        <input placeholder="Search action/detail/user" value="${esc(state.ui.logSearch||'')}" oninput="state.ui.logSearch=this.value; render()" style="border:1px solid var(--line); padding:6px 8px; font-size:12.5px; width:200px;" />
      </div>
      <button class="btn small" onclick="exportActivityLogCSV()">${ICONS.download} Export CSV</button>
    </div>
    <div class="panel" style="overflow-x:auto;">
      <table style="min-width:760px;">
        <thead><tr><th>Date &amp; time</th><th>Branch</th><th>User</th><th>Action</th><th>Detail</th></tr></thead>
        <tbody>
          ${shown.length === 0 ? `<tr><td colspan="5" style="text-align:center; color:#71717a; padding:24px;">No activity recorded yet for this filter.</td></tr>` : ''}
          ${shown.map(r => `<tr>
            <td style="color:#71717a; white-space:nowrap;">${fmtDate(r.ts)} ${new Date(r.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</td>
            <td>${esc(r.branch)}</td>
            <td style="color:#52525b;">${esc(r.username)||'—'}</td>
            <td>${esc(r.action)}</td>
            <td style="color:#71717a;">${esc(r.detail)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function exportActivityLogCSV() {
  const rows = [['Timestamp','Branch','Username','Action','Detail'],
    ...(state.activityLog||[]).slice().reverse().map(r => [r.ts, r.branch, r.username, r.action, r.detail])];
  downloadCSV(`activity-log-${todayStr()}.csv`, rows);
}

/* ================= DASHBOARD ================= */
function renderDashboard() {
  const totalCollected = Object.values(state.fees).flat().reduce((s, f) => s + Number(f.amount || 0), 0);
  const totalPending = scopedStudents().reduce((sum, st) => sum + Math.max(0, dueFor(st)), 0);
  const todayRec = state.attendance[todayStr()] || {};
  const present = Object.values(todayRec).filter(v => v === 'present').length;
  const attPct = scopedStudents().length ? Math.round((present / scopedStudents().length) * 100) : 0;
  const completionDueCount = scopedStudents().filter(isCompletionDue).length;

  const allExams = Object.values(state.results).flat();
  let avgResult = null;
  if (allExams.length) { const pcts = allExams.map(ex => examStats(ex).pct); avgResult = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length); }

  const dues = scopedStudents().map(st => ({ ...st, due: dueFor(st) }))
    .filter(st => st.due > 0).sort((a,b) => b.due - a.due).slice(0, 6);

  return `
    <div class="stat-grid">
      <div class="stat-cell"><div class="icon">${ICONS.students}</div><div class="value">${scopedStudents().length}</div><div class="label">Students enrolled</div></div>
      <div class="stat-cell"><div class="icon">${ICONS.courses}</div><div class="value">${state.courses.length}</div><div class="label">Courses offered</div></div>
      <div class="stat-cell"><div class="icon">${ICONS.fees}</div><div class="value">${fmtMoney(totalCollected)}</div><div class="label">Fees collected</div></div>
      <div class="stat-cell"><div class="icon">${ICONS.fees}</div><div class="value">${fmtMoney(totalPending)}</div><div class="label">Fees pending</div></div>
      <div class="stat-cell"><div class="icon">${ICONS.attendance}</div><div class="value">${attPct}%</div><div class="label">Present today</div></div>
      <div class="stat-cell"><div class="icon">${ICONS.promote}</div><div class="value">${completionDueCount}</div><div class="label">Completion due</div></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>Outstanding dues</h3><span class="badge rose">${dues.length} students</span></div>
        ${dues.length === 0 ? '<p class="muted">No pending dues. Every account is settled.</p>' : `
        <table><tbody>
          ${dues.map(s => `<tr><td>${esc(s.name)}</td><td style="color:#71717a">${esc(s.course)}</td><td class="right" style="color:var(--rose)">${fmtMoney(s.due)}</td></tr>`).join('')}
        </tbody></table>
        <div style="padding:8px 16px;"><button class="link-btn" onclick="state.ui.feesSubTab='due'; setTab('fees')">View full due report →</button></div>`}
      </div>
      <div class="panel panel-body-pad">
        <h3 style="margin-bottom:8px;">Average result score</h3>
        ${avgResult === null ? '<p class="muted" style="padding:0;">No results recorded yet.</p>' : `
          <div style="display:flex; align-items:center; gap:16px;">
            <div style="font-family:Georgia,serif; font-size:36px;">${avgResult}%</div>
            <span class="badge ${avgResult >= 50 ? 'emerald' : 'rose'}">${gradeFor(avgResult)} average</span>
          </div>`}
        <button class="btn small" style="margin-top:14px;" onclick="setTab('students'); openStudentModal('new')">${ICONS.plus} Enrol a new student</button>
        ${completionDueCount > 0 ? `<button class="btn small ghost" style="margin-top:8px;" onclick="state.ui.studentFilter='completionDue'; state.ui.studentSort='completion'; setTab('students')">${ICONS.promote} Review ${completionDueCount} due for completion</button>` : ''}
      </div>
    </div>
  `;
}

/* ================= STUDENTS ================= */
function renderStudents() {
  if (state.ui.viewingStudentDetail) return renderStudentDetail(state.ui.viewingStudentDetail);
  const q = state.ui.studentSearch.toLowerCase();
  let base = state.ui.showInactive ? scopedStudents() : scopedStudents().filter(s => s.status !== 'inactive');
  if (state.ui.studentCenterFilter) base = base.filter(s => (s.centers||[]).includes(state.ui.studentCenterFilter));
  if (state.ui.studentFilter === 'completionDue') base = base.filter(isCompletionDue);
  if (state.ui.studentFilter === 'completed') base = base.filter(s => !!s.completionDate);
  let filtered = base.filter(s =>
    s.name.toLowerCase().includes(q) || s.rollNo.toLowerCase().includes(q) || (s.regNo||'').toLowerCase().includes(q) || (s.course||'').toLowerCase().includes(q)
  );
  if (state.ui.studentSort === 'completion') {
    filtered = filtered.slice().sort((a,b) => (expectedCompletionDate(a)||'9999') < (expectedCompletionDate(b)||'9999') ? -1 : 1);
  } else if (state.ui.studentSort === 'admission') {
    filtered = filtered.slice().sort((a,b) => new Date(a.admissionDate||0) - new Date(b.admissionDate||0));
  } else {
    filtered = filtered.slice().sort((a,b) => a.name.localeCompare(b.name));
  }
  const inactiveCount = scopedStudents().filter(s => s.status === 'inactive').length;
  const dueCompletionCount = scopedStudents().filter(isCompletionDue).length;
  return `
    <div class="toolbar">
      <div class="search-wrap">${ICONS.search}<input placeholder="Search by name, reg no, roll no, course" value="${esc(state.ui.studentSearch)}" oninput="state.ui.studentSearch=this.value; render()" /></div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <select onchange="state.ui.studentFilter=this.value; render()" style="border:1px solid var(--line); padding:7px 8px; font-size:12.5px;">
          <option value="all" ${state.ui.studentFilter==='all'?'selected':''}>All students</option>
          <option value="completionDue" ${state.ui.studentFilter==='completionDue'?'selected':''}>Completion due (${dueCompletionCount})</option>
          <option value="completed" ${state.ui.studentFilter==='completed'?'selected':''}>Completed</option>
        </select>
        <select onchange="state.ui.studentSort=this.value; render()" style="border:1px solid var(--line); padding:7px 8px; font-size:12.5px;">
          <option value="name" ${state.ui.studentSort==='name'?'selected':''}>Sort: Name</option>
          <option value="admission" ${state.ui.studentSort==='admission'?'selected':''}>Sort: Admission date</option>
          <option value="completion" ${state.ui.studentSort==='completion'?'selected':''}>Sort: Expected completion</option>
        </select>
        ${state.centers.length ? `<select onchange="state.ui.studentCenterFilter=this.value; render()" style="border:1px solid var(--line); padding:7px 8px; font-size:12.5px;">
          <option value="">All centers</option>
          ${state.centers.map(c => `<option value="${esc(c.name)}" ${state.ui.studentCenterFilter===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>` : ''}
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:#52525b;">
          <input type="checkbox" ${state.ui.showInactive?'checked':''} onchange="state.ui.showInactive=this.checked; render()" /> Show inactive (${inactiveCount})
        </label>
        <button class="btn small ghost" onclick="downloadSampleStudentCSV()">${ICONS.download} Sample CSV</button>
        <button class="btn small ghost" onclick="document.getElementById('studentCsvFile').click()">${ICONS.upload} Import CSV</button>
        <input type="file" id="studentCsvFile" accept=".csv" style="display:none" onchange="handleStudentCsvImport(this.files[0])" />
        <button class="btn primary" onclick="openStudentModal('new')">${ICONS.plus} Add student</button>
      </div>
    </div>
    <div class="panel" style="overflow-x:auto;">
      <table style="min-width:900px;">
        <thead><tr><th>Reg no.</th><th>Student</th><th>Course</th><th>Center(s)</th><th>Fee status</th><th>Status</th><th class="right">Actions</th></tr></thead>
        <tbody>
          ${filtered.length === 0 ? `<tr><td colspan="7" style="text-align:center; color:#71717a; padding:24px;">No students match your search.</td></tr>` : ''}
          ${filtered.map(s => {
            const due = dueFor(s);
            const inactive = s.status === 'inactive';
            const compDue = isCompletionDue(s);
            return `<tr style="${inactive?'opacity:.6;':''}">
              <td style="color:#71717a; font-size:12.5px;">${esc(s.regNo)||'—'}</td>
              <td>
                <div style="display:flex;align-items:center;gap:10px;">
                  ${avatarHtml(s.name, null, s.photoUrl)}
                  <div>
                    <a href="javascript:void(0)" onclick="viewStudentDetail('${s.id}')" style="color:var(--ink);text-decoration:none;border-bottom:1px dotted #a1a1aa;">${esc(s.name)}</a>
                    <div style="font-size:11px;color:#a1a1aa;">#${esc(s.rollNo)}</div>
                  </div>
                </div>
              </td>
              <td style="color:#52525b">${esc(s.course)} ${compDue ? '<span class="badge amber" style="margin-left:4px;">Completion due</span>' : ''}</td>
              <td style="color:#52525b; font-size:12.5px;">${(s.centers&&s.centers.length) ? s.centers.map(esc).join(', ') : '—'}</td>
              <td>${due <= 0 ? '<span class="badge emerald">Paid</span>' : `<span class="badge rose">Due ${fmtMoney(due)}</span>`}</td>
              <td>${inactive ? '<span class="badge rose">Inactive</span>' : '<span class="badge emerald">Active</span>'}</td>
              <td class="right">
                <button class="icon-btn" title="Edit" onclick='openStudentModal(${JSON.stringify(s.id)})'>${ICONS.edit}</button>
                <button class="icon-btn" title="Promote" onclick='openPromoteModal(${JSON.stringify(s.id)})'>${ICONS.promote}</button>
                <button class="icon-btn" title="${inactive?'Enable':'Disable'}" onclick='${inactive?`enableStudent(${JSON.stringify(s.id)})`:`openDisableModal(${JSON.stringify(s.id)})`}'>${inactive?ICONS.check:ICONS.ban}</button>
                <button class="icon-btn" title="Full report" onclick="printStudentReport('${s.id}')">${ICONS.fileText}</button>
                <button class="icon-btn danger-hover" title="Remove" onclick='openDeleteModal(${JSON.stringify(s.id)})'>${ICONS.trash}</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

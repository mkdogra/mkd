        <button class="btn small" onclick="state.ui.selectedIdCardStudent='${s.id}'; setTab('idcards')">${ICONS.idcard} ID Card</button>

        <button class="btn small" onclick="printStudentReport('${s.id}')">${ICONS.fileText} Full report</button>

          const st = examStats(ex);
          return `<tr><td>${esc(ex.examName)}</td><td style="color:#71717a">${fmtDate(ex.date)}</td><td>${st.pct}%</td><td><span class="badge ${st.pass?'emerald':'rose'}">${st.grade}</span></td></tr>`;
        }).join('')}

/* ---------- Disable / Enable ---------- */
function openDisableModal(id) {
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="modal-head"><h3>Disable student</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
        <div class="modal-body">
          <p style="font-size:14px; margin:0 0 12px;">Mark <strong>${esc(s.name)}</strong> as inactive. They'll stay in your records but show as disabled throughout the register.</p>
          <label class="field"><span>Reason</span><textarea id="disable_reason" placeholder="e.g. Left the course, fee default, transferred"></textarea></label>
          <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn danger" onclick="disableStudent('${id}')">${ICONS.ban} Disable</button>
          </div>
        </div>
      </div>
    </div>
  `;
}
function disableStudent(id) {
  const reason = document.getElementById('disable_reason').value.trim();
  const s = state.students.find(x => x.id === id);
  state.students = state.students.map(s => s.id === id ? { ...s, status: 'inactive', disableReason: reason, disableDate: todayStr() } : s);
  persistStudents();
  logActivity('Student disabled', `${s ? s.name : id} — ${reason}`);
  closeModal();
  render();
}
function enableStudent(id) {
  const s = state.students.find(x => x.id === id);
  state.students = state.students.map(s => s.id === id ? { ...s, status: 'active', disableReason: '', disableDate: '' } : s);
  persistStudents();
  logActivity('Student re-enabled', s ? s.name : id);
  render();
}

/* ---------- Promote / Mark complete ---------- */
function openPromoteModal(id) {
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  const courseOptions = state.courses.filter(c => c.name !== s.course).map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="modal-head"><h3>Promote / complete course</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
        <div class="modal-body">
          <p class="muted" style="padding:0 0 10px;">Current course: <strong>${esc(s.course)||'—'}</strong></p>
          <div class="subtabs" style="margin-bottom:14px;">
            <button class="${state.ui.promoteMode!=='complete'?'active':''}" onclick="state.ui.promoteMode='promote'; openPromoteModal('${id}')">Promote to new course</button>
            <button class="${state.ui.promoteMode==='complete'?'active':''}" onclick="state.ui.promoteMode='complete'; openPromoteModal('${id}')">Mark course completed</button>
          </div>
          ${state.ui.promoteMode === 'complete' ? `
            <label class="field"><span>Completion date</span><input type="date" id="promote_date" value="${todayStr()}" /></label>
            <label class="field"><span>Final grade</span>
              <select id="promote_grade">
                <option value="">No grade</option>

              </select>
            </label>
          ` : `
            <label class="field"><span>Promote to course</span>
              <select id="promote_course">
                <option value="">Select a course</option>
                ${courseOptions}
              </select>
            </label>
            <label class="field"><span>Promotion date</span><input type="date" id="promote_date" value="${todayStr()}" /></label>
            <label style="display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:10px;">
              <input type="checkbox" id="promote_resetfee" /> Reset fee record for the new course (total fee only; payments kept)
            </label>
          `}
          <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn primary" onclick="${state.ui.promoteMode==='complete'?`completeStudentCourse('${id}')`:`promoteStudent('${id}')`}">Save</button>
          </div>

      </div>
    </div>
  `;
}
function completeStudentCourse(id) {
  const date = document.getElementById('promote_date').value || todayStr();
  const grade = document.getElementById('promote_grade').value;
  const s0 = state.students.find(x => x.id === id);
  state.students = state.students.map(s => {
    if (s.id !== id) return s;
    const history = [...(s.courseHistory||[]), { type: 'completed', fromCourse: s.course, date, grade }];
    return { ...s, completionDate: date, finalGrade: grade, courseHistory: history };
  });
  persistStudents();
  logActivity('Course completed', `${s0 ? s0.name : id} — ${s0?.course || ''}${grade ? ' (Grade ' + grade + ')' : ''}`);
  closeModal();
  render();
}
function promoteStudent(id) {
  const newCourse = document.getElementById('promote_course').value;
  const date = document.getElementById('promote_date').value || todayStr();
  const resetFee = document.getElementById('promote_resetfee').checked;
  if (!newCourse) return;
  const s0 = state.students.find(x => x.id === id);
  state.students = state.students.map(s => {
    if (s.id !== id) return s;
    const history = [...(s.courseHistory||[]), { type: 'promoted', fromCourse: s.course, toCourse: newCourse, date }];
    const newCourseData = state.courses.find(c => c.name === newCourse);
    return { ...s, course: newCourse, courseHistory: history, totalFee: resetFee ? Number(newCourseData?.fee || 0) : s.totalFee };
  });
  persistStudents();
  logActivity('Student promoted', `${s0 ? s0.name : id}: ${s0?.course || '—'} → ${newCourse}`);
  closeModal();
  render();
}

function saveStudent(editId) {
  const val = id => document.getElementById(id).value;
  const name = val('f_name').trim();
  const rollNo = val('f_rollNo').trim();
  if (!name || !rollNo) return;
  const existing = editId ? state.students.find(s => s.id === editId) : null;
  const session = existing ? (existing.session || sessionLabelForDate(existing.admissionDate)) : currentSession().label;
  const regNo = existing ? (existing.regNo || generateRegNo(session)) : generateRegNo(session);
  const data = {
    id: editId || uid(),
    regNo, session,
    rollNo, name,
    course: val('f_course').trim(),
    feeGroupId: val('f_feeGroupId'),
    admissionDate: val('f_admissionDate') || todayStr(),
    totalFee: Number(val('f_totalFee')) || 0,
    discountType: val('f_discountType') === 'percent' ? 'percent' : 'flat',
    discountValue: Number(val('f_discountValue')) || 0,
    centers: (() => {
      const c = state.ui.pendingCenters.slice();
      if (!isAdmin() && currentBranchObj() && !c.includes(currentBranchObj().name)) c.push(currentBranchObj().name);
      return c;
    })(),
    dob: val('f_dob'),
    gender: val('f_gender'),
    bloodGroup: val('f_bloodGroup').trim(),
    email: val('f_email').trim(),
    contact: val('f_contact').trim(),
    altContact: val('f_altContact').trim(),
    aadharNo: val('f_aadharNo').trim(),
    qualification: val('f_qualification').trim(),
    addrStreet: val('f_addrStreet').trim(),
    addrWard: val('f_addrWard').trim(),
    addrCity: val('f_addrCity').trim(),
    addrDistrict: (val('f_addrDistrict') === '__other__' ? val('f_addrDistrictOther') : val('f_addrDistrict')).trim(),
    addrState: (val('f_addrState') === '__other__' ? val('f_addrStateOther') : val('f_addrState')).trim(),
    addrPin: val('f_addrPin').trim(),
    address: existing ? existing.address || '' : '',
    fatherName: val('f_fatherName').trim(),
    motherName: val('f_motherName').trim(),
    photoUrl: state.ui.pendingPhotoDataUrl || '',
    status: existing ? existing.status || 'active' : 'active',
    disableReason: existing ? existing.disableReason || '' : '',
    disableDate: existing ? existing.disableDate || '' : '',
    finalGrade: existing ? existing.finalGrade || '' : '',
    completionDate: existing ? existing.completionDate || '' : '',
    courseHistory: existing ? existing.courseHistory || [] : [],
  };
  if (editId) state.students = state.students.map(s => s.id === editId ? data : s);
  else state.students = [...state.students, data];
  persistStudents();
  logActivity(editId ? 'Student updated' : 'Student registered', `${name} (${regNo})`);
  closeModal();
  render();
}

          <div class="form-grid-2">
            <label class="field"><span>Username</span><input id="ctr_username" value="${esc(c.username)}" autocomplete="off" /></label>
            <label class="field"><span>${isNew ? 'Password' : 'New password'}</span><input id="ctr_password" type="password" placeholder="${isNew ? '' : 'Leave blank to keep unchanged'}" autocomplete="new-password" /></label>
          </div>
          ${!isNew ? '<p class="muted" style="padding:0;">For security, the current password isn\'t shown. Only fill it in if you want to change it.</p>' : ''}
          <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn primary" onclick="saveCenter('${editId}')">Save branch</button>
          </div>
        </div>
      </div>
    </div>
  `;
}
async function saveCenter(editId) {
  const name = document.getElementById('ctr_name').value.trim();
  if (!name) return;
  const username = document.getElementById('ctr_username').value.trim();
  const newPassword = document.getElementById('ctr_password').value;
  const existing = editId ? state.centers.find(c => c.id === editId) : null;
  if (!editId && !newPassword) { alert('Set a password for this branch login.'); return; }
  let salt = existing ? existing.salt : '';
  let hash = existing ? existing.hash : '';
  if (newPassword) {
    salt = randomHex(8);
    hash = await hashPassword(newPassword, salt);
  }
  const data = {
    id: editId || uid(),
    name,
    location: document.getElementById('ctr_location').value.trim(),
    operatorName: document.getElementById('ctr_operator').value.trim(),
    username: username || (existing ? existing.username : ''),
    salt, hash,
  };
  if (editId) {
    const oldName = existing?.name;
    state.centers = state.centers.map(c => c.id === editId ? data : c);
    if (oldName && oldName !== name) {
      state.students = state.students.map(s => (s.centers||[]).includes(oldName)
        ? { ...s, centers: s.centers.map(cn => cn === oldName ? name : cn) } : s);
      persistStudents();
    }
    logActivity('Branch updated', `Edited branch "${name}"`, 'admin', state.adminAuth.username);
  } else {
    state.centers = [...state.centers, data];
    logActivity('Branch created', `Added branch "${name}"`, 'admin', state.adminAuth.username);
  }
  persistCenters();
  closeModal();
  render();
}
function deleteCenter(id) {
  const c = state.centers.find(x => x.id === id);
  state.centers = state.centers.filter(x => x.id !== id);
  if (c) {
    state.students = state.students.map(s => (s.centers||[]).includes(c.name)
      ? { ...s, centers: s.centers.filter(cn => cn !== c.name) } : s);
    persistStudents();
  }
  persistCenters();
  render();
}

function updatePaymentPreview() {
  const amount = Number(document.getElementById('pay_amount')?.value) || 0;
  const discount = Number(document.getElementById('pay_discount')?.value) || 0;
  const fine = Number(document.getElementById('pay_fine')?.value) || 0;
  const total = Math.max(0, amount - discount + fine);
  const el = document.getElementById('payPreviewTotal');
  if (el) el.textContent = fmtMoney(total);
}
function nextReceiptNo() {
  const count = Object.values(state.fees).flat().length;
  return count + 1;
}
function addPayment(studentId) {
  const amount = Number(document.getElementById('pay_amount').value);
  if (!amount) return;
  const payDate = document.getElementById('pay_date').value || todayStr();
  if (payDate < todayStr()) {
    alert("Fee entries cannot be backdated. Please use today's date or a future date.");
    return;
  }
  const discount = Number(document.getElementById('pay_discount').value) || 0;
  const fine = Number(document.getElementById('pay_fine').value) || 0;
  const totalPaid = Math.max(0, amount - discount + fine);
  const txn = {
    id: uid(),
    amount: totalPaid,
    baseAmount: amount,
    discount, fine,
    activity: document.getElementById('pay_activity').value.trim(),
    feeMonth: document.getElementById('pay_month').value,
    date: payDate,
    mode: document.getElementById('pay_mode').value,
    receiptNo: nextReceiptNo(),
    recordedBy: state.currentBranch === 'admin' ? 'Admin' : (currentBranchObj() ? currentBranchObj().name : ''),
  };
  state.fees[studentId] = [...(state.fees[studentId] || []), txn];
  persistFees();
  const st = state.students.find(s => s.id === studentId);
  logActivity('Fee payment recorded', `${fmtMoney(totalPaid)} for ${st ? st.name : studentId}${txn.activity ? ' — ' + txn.activity : ''}`);
  render();
}

function deletePayment(studentId, txnId) {
  const t = (state.fees[studentId] || []).find(x => x.id === txnId);
  if (t && t.date < todayStr() && !isAdmin()) {
    alert("This payment was recorded on an earlier date and can't be removed from a branch login. Contact the admin if a correction is needed.");
    return;
  }
  state.fees[studentId] = (state.fees[studentId] || []).filter(t => t.id !== txnId);
  persistFees();
  const st = state.students.find(s => s.id === studentId);
  logActivity('Fee payment deleted', `${t ? fmtMoney(t.amount) : ''} for ${st ? st.name : studentId}`);
  render();
}

/* ================= FINANCE REPORT ================= */
function renderFinance() {
  const scopedIds = new Set(scopedStudents().map(s => s.id));
  const scopedFeeEntries = Object.entries(state.fees).filter(([sid]) => scopedIds.has(sid));
  const totalFeeAll = scopedStudents().reduce((s,st)=>s+Number(st.totalFee||0),0);
  const totalDiscountAll = scopedStudents().reduce((s,st)=>s+discountAmountFor(st),0);
  const totalNetAll = scopedStudents().reduce((s,st)=>s+netFeeFor(st),0);
  const totalCollected = scopedFeeEntries.flatMap(([,txns])=>txns).reduce((s,f)=>s+Number(f.amount||0),0);
  const totalPending = Math.max(0, totalNetAll - totalCollected);
  const collectionRate = totalNetAll ? Math.round((totalCollected/totalNetAll)*100) : 0;

  const byCourse = {};
  scopedStudents().forEach(s => {
    const key = s.course || 'Unassigned';
    if (!byCourse[key]) byCourse[key] = { students: 0, total: 0, collected: 0 };
    byCourse[key].students++;
    byCourse[key].total += netFeeFor(s);
    byCourse[key].collected += paidFor(s.id);
  });

  const monthMap = {};
  scopedFeeEntries.flatMap(([,txns])=>txns).forEach(t => {
    const m = String(t.date||'').slice(0,7);
    if (!m) return;
    monthMap[m] = (monthMap[m]||0) + Number(t.amount||0);
  });
  const months = Object.keys(monthMap).sort().slice(-6);

  const from = state.ui.feeFrom, to = state.ui.feeTo;
  const payments = [];
  scopedStudents().forEach(s => {
    (state.fees[s.id] || []).forEach(t => {
      if (t.date >= from && t.date <= to) payments.push({ s, t });
    });
  });
  payments.sort((a,b) => new Date(b.t.date) - new Date(a.t.date));
  const rangeTotal = payments.reduce((sum,p) => sum + Number(p.t.amount||0), 0);

  return `
    <div class="toolbar">
      <p class="muted" style="padding:0;">A consolidated view of income, discounts, dues, and collection performance across the register.</p>
      <button class="btn small" onclick="printFinanceReport()">${ICONS.print} Print report</button>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(5,1fr);">
      <div class="stat-cell"><div class="value">${fmtMoney(totalFeeAll)}</div><div class="label">Gross fee value</div></div>
      <div class="stat-cell"><div class="value" style="color:var(--sky)">-${fmtMoney(totalDiscountAll)}</div><div class="label">Total discounts given</div></div>
      <div class="stat-cell"><div class="value" style="color:var(--emerald)">${fmtMoney(totalCollected)}</div><div class="label">Total collected</div></div>
      <div class="stat-cell"><div class="value" style="color:var(--rose)">${fmtMoney(totalPending)}</div><div class="label">Total pending</div></div>
      <div class="stat-cell"><div class="value">${collectionRate}%</div><div class="label">Collection rate</div></div>
    </div>
    <h3 style="font-size:16px; margin-bottom:10px;">By course (net of discount)</h3>
    <div class="panel" style="overflow-x:auto; margin-bottom:24px;">
      <table style="min-width:560px;">
        <thead><tr><th>Course</th><th>Students</th><th>Net fee</th><th>Collected</th><th>Pending</th></tr></thead>
        <tbody>
          ${Object.entries(byCourse).map(([course,d]) => `<tr><td>${esc(course)}</td><td>${d.students}</td><td>${fmtMoney(d.total)}</td><td style="color:var(--emerald)">${fmtMoney(d.collected)}</td><td style="color:var(--rose)">${fmtMoney(Math.max(0,d.total-d.collected))}</td></tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:#71717a;padding:20px;">No students enrolled yet.</td></tr>`}
        </tbody>
      </table>
    </div>
    <h3 style="font-size:16px; margin-bottom:10px;">Monthly collection (last 6 months with activity)</h3>
    <div class="panel" style="overflow-x:auto; margin-bottom:24px;">
      <table style="min-width:360px;">
        <thead><tr><th>Month</th><th>Collected</th></tr></thead>
        <tbody>
          ${months.length === 0 ? `<tr><td colspan="2" style="text-align:center;color:#71717a;padding:20px;">No payments recorded yet.</td></tr>` : ''}
          ${months.map(m => `<tr><td>${m}</td><td>${fmtMoney(monthMap[m])}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="toolbar">
      <h3 style="font-size:16px;">Payments received &mdash; whose fees, and when</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="date" value="${from}" onchange="state.ui.feeFrom=this.value; render()" style="border:1px solid var(--line); padding:6px 8px; font-size:13px;" />
        <span class="muted" style="padding:0;">to</span>
        <input type="date" value="${to}" onchange="state.ui.feeTo=this.value; render()" style="border:1px solid var(--line); padding:6px 8px; font-size:13px;" />
      </div>
    </div>
    <div class="panel" style="overflow-x:auto;">
      <table style="min-width:760px;">
        <thead><tr><th>Date</th><th>Reg No.</th><th>Student</th><th>Course</th><th>Activity</th><th>Mode</th><th class="right">Amount</th></tr></thead>
        <tbody>
          ${payments.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:#71717a;padding:20px;">No payments in this date range.</td></tr>` : ''}
          ${payments.map(({s,t}) => `<tr>
            <td style="color:#71717a">${fmtDate(t.date)}</td>
            <td style="color:#71717a; font-size:12.5px;">${esc(s.regNo)||'—'}</td>
            <td>${esc(s.name)}</td>
            <td style="color:#52525b">${esc(s.course)||'—'}</td>
            <td style="color:#52525b">${esc(t.activity)||'—'}</td>
            <td style="color:#71717a">${esc(t.mode)}</td>
            <td class="right" style="color:var(--emerald)">${fmtMoney(t.amount)}</td>
          </tr>`).join('')}
        </tbody>
        ${payments.length > 0 ? `<tfoot><tr><td colspan="6" style="text-align:right;font-weight:bold;padding:8px;">Total for range</td><td class="right" style="font-weight:bold;">${fmtMoney(rangeTotal)}</td></tr></tfoot>` : ''}
      </table>
    </div>
  `;
}

          <span class="badge ${st.pass ? 'emerald' : 'rose'}">${st.pass ? 'Pass' : 'Fail'}</span>
        </div>
        <div style="margin-top:16px; text-align:right;">
          <button class="btn small" onclick='printResultCard(${JSON.stringify(student.id)}, ${JSON.stringify(ex.id)})'>${ICONS.print} Print result card</button>
        </div>
      </div>

    const rows = exams.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).map(ex => {

  const student = scopedStudents().find(s => s.id === selected);

  const listHtml = scopedStudents().map(s => `
    <button class="list-item ${s.id === selected ? 'active' : ''}" onclick="state.ui.selectedIdCardStudent='${s.id}'; render()">
      ${avatarHtml(s.name, null, s.photoUrl)}<div><div class="name">${esc(s.name)}</div><div class="sub">#${esc(s.rollNo)} · ${esc(s.course)}</div></div>
    </button>`).join('') || emptyState('No students yet.');

  let rightHtml;
  if (!student) {
    rightHtml = emptyState('Select a student to generate an ID card.');
  } else {
    rightHtml = `
      <p class="muted" style="text-align:center; padding:0 0 14px;">Standard CR80 card proportions — prints at credit-card size.</p>
      ${idCardHtml(student)}
      <div style="text-align:center; margin-top:20px;">
        <button class="btn primary small" onclick="printIdCard('${student.id}')">${ICONS.print} Print ID card</button>
      </div>
    `;
  }
  return `<div class="grid-3">
    <div class="panel list-panel"><div class="panel-head"><h3>Students</h3></div>${listHtml}</div>
    <div>${rightHtml}</div>
  </div>`;
}
function printIdCard(studentId) {
  const s = state.students.find(x => x.id === studentId);
  if (!s) return;
  const w = window.open('', '_blank', 'width=460,height=380');
  if (!w) { alert('Please allow pop-ups to print this document.'); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>ID card - ${esc(s.name)}</title><meta charset="UTF-8">
  <style>
    @page { size: 3.375in 2.125in; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0.08in; display: flex; align-items: center; justify-content: center; background: #fff; }
    .idcard { width: 3.2in; aspect-ratio: 1.586/1; background: #fff; border: 1px solid #d4d4d8; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, Arial, sans-serif; }
    .idcard-head { background: linear-gradient(120deg, #18181b 0%, #3f2f13 60%, #b45309 130%); color: #fff; padding: 7px 10px; display: flex; align-items: center; gap: 7px; }
    .idcard-logo { width: 22px; height: 22px; object-fit: contain; background: #fff; border-radius: 3px; padding: 1px; flex-shrink: 0; }
    .idcard-head .org { font-family: Georgia, serif; font-size: 11.5px; font-weight: bold; line-height: 1.2; }
    .idcard-head .sub { font-size: 8px; opacity: 0.9; }
    .idcard-body { flex: 1; display: flex; padding: 8px 10px; gap: 8px; align-items: center; }
    .idcard-photo { width: 0.8in; height: 1in; border: 1px solid #d4d4d8; background: #f4f4f5; flex-shrink: 0; overflow: hidden; }
    .idcard-photo img { width: 100%; height: 100%; object-fit: cover; }
    .idcard-photo .ph-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 24px; color: #fff; }
    .idcard-fields { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
    .idcard-qr { flex-shrink: 0; align-self: center; }
    .idcard-name { font-family: Georgia, serif; font-size: 12.5px; font-weight: bold; color: #18181b; margin-bottom: 2px; }
    .idcard-line { display: flex; font-size: 8px; color: #3f3f46; gap: 3px; }
    .idcard-line b { color: #71717a; font-weight: 600; min-width: 42px; }
    .idcard-foot { border-top: 1px dashed #d4d4d8; padding: 4px 10px 6px; display: flex; justify-content: space-between; align-items: flex-end; }
    .idcard-foot .regno { font-size: 8px; font-weight: bold; letter-spacing: 0.03em; color: #b45309; }
    .idcard-foot .sig { font-size: 6.5px; color: #71717a; text-align: right; }
    .idcard-barcode { height: 12px; background: repeating-linear-gradient(90deg, #18181b 0px, #18181b 1.5px, transparent 1.5px, transparent 3px); margin: 2px 10px 0; opacity: 0.85; }
  </style></head><body>${idCardHtml(s)}<script>setTimeout(()=>{window.focus();window.print();},250)<\/script></body></html>`);
  w.document.close();
}

/* ================= FULL STUDENT REPORT ================= */
function printStudentReport(studentId) {
  const s = state.students.find(x => x.id === studentId);
  if (!s) return;
  const paid = paidFor(s.id);
  const discount = discountAmountFor(s);
  const due = dueFor(s);
  const att = attendanceStatsFor(s.id, null, null);
  const exams = (state.results[s.id] || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));
  const txns = (state.fees[s.id] || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));
  const photoHtml = s.photoUrl
    ? `<img src="${s.photoUrl}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;" />`
    : `<div style="width:64px;height:64px;border-radius:50%;background:${colorForName(s.name)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-family:Georgia,serif;">${esc(initials(s.name))}</div>`;
  const body = `
    <div style="display:flex; align-items:center; gap:16px; border-bottom:2px solid #18181b; padding-bottom:14px; margin-bottom:16px;">
      ${photoHtml}
      <div style="flex:1;">
        <h2 style="margin:0;">${esc(state.instituteName)}</h2>
        <p class="muted" style="margin-top:2px;">Student Report &middot; Generated ${fmtDate(todayStr())}</p>
      </div>
      ${qrImgHtml(s, 70, 3)}
    </div>
    <h3 style="margin-bottom:6px;">${esc(s.name)} ${s.status==='inactive' ? '(Inactive)' : ''}</h3>
    <div class="row"><span>Registration No.</span><span>${esc(s.regNo) || '—'}</span></div>
    <div class="row"><span>Session</span><span>${esc(s.session) || '—'}</span></div>
    <div class="row"><span>Roll No</span><span>${esc(s.rollNo)}</span></div>
    <div class="row"><span>Course</span><span>${esc(s.course)||'—'}</span></div>
    <div class="row"><span>Center(s)</span><span>${(s.centers&&s.centers.length) ? esc(s.centers.join(', ')) : '—'}</span></div>
    <div class="row"><span>Admission date</span><span>${fmtDate(s.admissionDate)}</span></div>
    <div class="row"><span>Course completion date</span><span>${s.completionDate ? fmtDate(s.completionDate) : '—'}</span></div>
    <div class="row"><span>Final grade</span><span>${esc(s.finalGrade) || '—'}</span></div>
    <div class="row"><span>Date of birth</span><span>${fmtDate(s.dob) || '—'}</span></div>
    <div class="row"><span>Gender</span><span>${esc(s.gender) || '—'}</span></div>
    <div class="row"><span>Blood group</span><span>${esc(s.bloodGroup) || '—'}</span></div>
    <div class="row"><span>Contact</span><span>${esc(s.contact) || '—'}</span></div>
    <div class="row"><span>Father's name</span><span>${esc(s.fatherName) || '—'}</span></div>
    <div class="row"><span>Address</span><span>${esc(formatAddress(s)) || '—'}</span></div>

    <h3 style="margin-top:22px;">Fee summary</h3>
    <div class="row"><span>Total fee</span><span>${fmtMoney(s.totalFee)}</span></div>
    ${discount > 0 ? `<div class="row"><span>Discount</span><span>-${fmtMoney(discount)}</span></div>` : ''}
    <div class="row"><span>Paid</span><span>${fmtMoney(paid)}</span></div>
    <div class="row"><span>Balance due</span><span>${fmtMoney(Math.max(0,due))}</span></div>
    ${txns.length ? `<table><thead><tr><th>Date</th><th>Amount</th><th>Mode</th></tr></thead><tbody>
      ${txns.map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${fmtMoney(t.amount)}</td><td>${esc(t.mode)}</td></tr>`).join('')}
    </tbody></table>` : `<p class="muted">No payments recorded.</p>`}

    <h3 style="margin-top:22px;">Attendance summary</h3>
    <div class="row"><span>Days marked</span><span>${att.marked}</span></div>
    <div class="row"><span>Present</span><span>${att.present}</span></div>
    <div class="row"><span>Absent</span><span>${att.absent}</span></div>
    <div class="row"><span>Present %</span><span>${att.pct}%</span></div>

    <h3 style="margin-top:22px;">Exam results</h3>
    ${exams.length ? `<table><thead><tr><th>Exam</th><th>Date</th><th>%</th><th>Grade</th><th>Result</th></tr></thead><tbody>
      ${exams.map(ex => { const st = examStats(ex); return `<tr><td>${esc(ex.examName)}</td><td>${fmtDate(ex.date)}</td><td>${st.pct}%</td><td>${st.grade}</td><td>${st.pass?'Pass':'Fail'}</td></tr>`; }).join('')}
    </tbody></table>` : `<p class="muted">No results recorded.</p>`}

    ${(s.courseHistory && s.courseHistory.length) ? `
    <h3 style="margin-top:22px;">Course history</h3>
    <table><thead><tr><th>Date</th><th>Event</th></tr></thead><tbody>
      ${s.courseHistory.slice().reverse().map(h => `<tr><td>${fmtDate(h.date)}</td><td>${h.type==='completed' ? `Completed ${esc(h.fromCourse)}${h.grade?` (Grade ${esc(h.grade)})`:''}` : `Promoted ${esc(h.fromCourse)||'—'} → ${esc(h.toCourse)}`}</td></tr>`).join('')}
    </tbody></table>` : ''}
  `;
  openPrintWindow(`Student report - ${s.name}`, body);
}

/* ================= CERTIFICATES ================= */
function buildCertData(student, type) {
  const gradeClause = student.finalGrade ? `, with Grade <strong>${esc(student.finalGrade)}</strong>` : '';
  let examName = '', percentage = '', grade = '';
  if (type === 'merit') {
    const ex = (state.results[student.id] || []).find(e => e.id === state.ui.certExamId);
    if (ex) { const st = examStats(ex); examName = esc(ex.examName); percentage = st.pct; grade = st.grade; }
  }
  return {
    name: esc(student.name), rollNo: esc(student.rollNo), course: esc(student.course) || '—',
    fatherName: esc(student.fatherName) || '—', motherName: esc(student.motherName) || '—',
    date: fmtDate(student.completionDate || todayStr()), gradeClause, examName, percentage, grade,
  };
}
function renderCertificates() {
  if (!state.ui.selectedCertStudent && scopedStudents().length) state.ui.selectedCertStudent = scopedStudents()[0].id;
  const selected = state.ui.selectedCertStudent;
  const student = scopedStudents().find(s => s.id === selected);
  const exams = student ? (state.results[student.id] || []) : [];
  if (!state.ui.certExamId && exams.length) state.ui.certExamId = exams[0].id;

  const listHtml = scopedStudents().map(s => `
    <button class="list-item ${s.id === selected ? 'active' : ''}" onclick="state.ui.selectedCertStudent='${s.id}'; state.ui.certExamId=null; render()">
      ${avatarHtml(s.name, null, s.photoUrl)}<div><div class="name">${esc(s.name)}</div><div class="sub">#${esc(s.rollNo)} · ${esc(s.course)}</div></div>
    </button>`).join('') || emptyState('No students yet.');

  let rightHtml;
  if (!student) {
    rightHtml = emptyState('Select a student to generate a certificate.');
  } else {
    const chosenExam = exams.find(e => e.id === state.ui.certExamId);
    const meritReady = state.ui.certType === 'merit' && chosenExam;
    const tpl = state.certTemplates[state.ui.certType];
    const data = buildCertData(student, state.ui.certType);
    const bodyText = (state.ui.certType === 'completion' || meritReady)
      ? fillTemplate(tpl.body, data)
      : `<em style="color:#a1a1aa;">Select an exam result to preview the merit text.</em>`;
    const photoBlock = student.photoUrl
      ? `<img src="${student.photoUrl}" class="cert-photo" />`
      : `<div class="cert-photo cert-photo-fallback" style="background:${colorForName(student.name)};">${esc(initials(student.name))}</div>`;
    const certNo = `${REG_PREFIX}-CERT-${String(student.regNo||'').replace(/\D/g,'').slice(-4) || '0000'}`;
    rightHtml = `
      <div class="subtabs" style="margin-bottom:14px;">
        <button class="${state.ui.certType==='completion'?'active':''}" onclick="state.ui.certType='completion'; render()">Course completion</button>
        <button class="${state.ui.certType==='merit'?'active':''}" onclick="state.ui.certType='merit'; render()">Merit (exam result)</button>
        <button class="btn small ghost" style="margin-left:auto;" onclick="openCertTemplateModal()">Customize template</button>
        ${isAdmin() ? `<button class="btn small ghost" onclick="document.getElementById('certBgFile').click()">Upload border/background</button>
        <input type="file" id="certBgFile" accept="image/*" style="display:none" onchange="handleCertBackgroundUpload(this.files[0])" />
        ${state.brand.certBackgroundUrl ? `<button class="btn small ghost" onclick="clearCertBackground()">Reset border</button>` : ''}` : ''}
      </div>
      ${state.ui.certType === 'merit' ? `
        <label class="field" style="max-width:320px;"><span>Select exam</span>
          <select onchange="state.ui.certExamId=this.value; render()">
            ${exams.length === 0 ? `<option value="">No results recorded</option>` : exams.map(e => `<option value="${e.id}" ${e.id===state.ui.certExamId?'selected':''}>${esc(e.examName)} (${fmtDate(e.date)})</option>`).join('')}
          </select>
        </label>
      ` : ''}
      <div class="cert-preview-wrap">
        ${certificateHtml(student, tpl, bodyText, certNo, photoBlock)}
      </div>
      <div style="text-align:center; margin-top:16px;">
        <button class="btn primary small" ${state.ui.certType==='merit' && !chosenExam ? 'disabled' : ''} onclick="printCertificate('${student.id}')">${ICONS.print} Print certificate</button>
      </div>
    `;
  }
  return `<div class="grid-3">
    <div class="panel list-panel"><div class="panel-head"><h3>Students</h3></div>${listHtml}</div>
    <div>${rightHtml}</div>
  </div>`;
}
function certificateHtml(s, tpl, bodyText, certNo, photoBlockOverride) {
  const branch = (s.centers && s.centers[0]) || currentBranchObj()?.name || '';
  const photoBlock = photoBlockOverride !== undefined ? photoBlockOverride : (s.photoUrl
    ? `<img src="${s.photoUrl}" class="cert-photo" />`
    : `<div class="cert-photo cert-photo-fallback" style="background:${colorForName(s.name)};">${esc(initials(s.name))}</div>`);
  const emblemBlock = state.brand.logoUrl
    ? `<img src="${state.brand.logoUrl}" class="cert-logo" />`
    : `<div class="cert-emblem">${esc(initials(state.instituteName))}</div>`;
  const bgStyle = state.brand.certBackgroundUrl ? ` style="background-image:url('${state.brand.certBackgroundUrl}');"` : '';
  return `
    <div class="cert-doc"${bgStyle}>
      <div class="cert-corner tl"></div><div class="cert-corner tr"></div><div class="cert-corner bl"></div><div class="cert-corner br"></div>
      <div class="cert-photo-slot">${photoBlock}</div>
      ${emblemBlock}
      <div class="cert-org">${esc(state.brand.name)}</div>
      <div class="cert-org-sub">${esc(state.brand.sub)}${branch ? ' &middot; ' + esc(branch) : ''}</div>
      <div class="cert-org-addr">${esc(state.brand.address)}</div>
      <div class="cert-hr"></div>
      <div class="cert-title">${esc(tpl.title)}</div>
      <p class="cert-lead">This is to certify that</p>
      <p class="cert-name">${esc(s.name)}</p>
      <p class="cert-lead">S/o &ndash; D/o ${esc(s.fatherName) || '—'}</p>
      <p class="cert-body">${bodyText}</p>
      <div class="cert-details">
        <div><span>Reg. No.</span><b>${esc(s.regNo) || '—'}</b></div>
        <div><span>Roll No.</span><b>${esc(s.rollNo)}</b></div>
        <div><span>Course</span><b>${esc(s.course) || '—'}</b></div>
        <div><span>Session</span><b>${esc(s.session) || currentSession().label}</b></div>
      </div>
      <p class="cert-issued">Certificate No. ${esc(certNo)} &nbsp;&middot;&nbsp; Issued on ${fmtDate(state.ui.certType==='completion' ? (s.completionDate||todayStr()) : todayStr())}</p>
      <div class="cert-footer">
        <div class="cert-sig"><div class="cert-sig-line"></div><span>${esc(tpl.left)}</span></div>
        <div class="cert-qr">${qrImgHtml(s, 50, 2)}<span>Scan for details</span></div>
        <div class="cert-seal"><div class="cert-seal-ring"><span>OFFICIAL<br/>SEAL</span></div></div>
        <div class="cert-sig"><div class="cert-sig-line"></div><span>${esc(tpl.right)}</span></div>
      </div>
      <div class="cert-grading">Grading: A+ (90&ndash;100%) &middot; A (80&ndash;89%) &middot; B+ (70&ndash;79%) &middot; B (60&ndash;69%) &middot; C (50&ndash;59%) &middot; D (33&ndash;49%) &middot; F (Below 33%) — Pass mark: 33%</div>
    </div>
  `;
}
function openCertTemplateModal() {
  if (!isAdmin()) { alert('Only the admin login can customize certificate templates — they apply to every branch.'); return; }
  const type = state.ui.certType;
  const tpl = state.certTemplates[type];
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay">
      <div class="modal wide">
        <div class="modal-head"><h3>Customize ${type === 'completion' ? 'completion' : 'merit'} certificate</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
        <div class="modal-body">
          <p class="muted" style="padding:0 0 10px;">Available placeholders: {{name}}, {{rollNo}}, {{course}}, {{fatherName}}, {{motherName}}, {{date}}, {{gradeClause}}${type==='merit' ? ', {{examName}}, {{percentage}}, {{grade}}' : ''}</p>
          <label class="field"><span>Certificate title</span><input id="ct_title" value="${esc(tpl.title)}" /></label>
          <label class="field"><span>Body text</span><textarea id="ct_body" style="min-height:90px;">${esc(tpl.body)}</textarea></label>
          <div class="form-grid-2">
            <label class="field"><span>Left signatory label</span><input id="ct_left" value="${esc(tpl.left)}" /></label>
            <label class="field"><span>Right signatory label</span><input id="ct_right" value="${esc(tpl.right)}" /></label>
          </div>
          <div class="modal-actions">
            <button class="btn ghost" onclick="resetCertTemplate('${type}')">Reset to default</button>
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn primary" onclick="saveCertTemplate('${type}')">Save template</button>
          </div>
        </div>
      </div>
    </div>
  `;
}
function saveCertTemplate(type) {
  state.certTemplates[type] = {
    title: document.getElementById('ct_title').value.trim() || DEFAULT_CERT_TEMPLATES[type].title,
    body: document.getElementById('ct_body').value.trim() || DEFAULT_CERT_TEMPLATES[type].body,
    left: document.getElementById('ct_left').value.trim() || DEFAULT_CERT_TEMPLATES[type].left,
    right: document.getElementById('ct_right').value.trim() || DEFAULT_CERT_TEMPLATES[type].right,
  };
  persistCertTemplates();
  closeModal();
  render();
}
function resetCertTemplate(type) {
  state.certTemplates[type] = { ...DEFAULT_CERT_TEMPLATES[type] };
  persistCertTemplates();
  openCertTemplateModal();
}
function printCertificate(studentId) {
  const s = state.students.find(x => x.id === studentId);
  if (!s) return;
  const type = state.ui.certType;
  const tpl = state.certTemplates[type];
  if (type === 'merit' && !(state.results[s.id] || []).find(e => e.id === state.ui.certExamId)) {
    alert('Select an exam result first.');
    return;
  }
  const data = buildCertData(s, type);
  const bodyText = fillTemplate(tpl.body, data);
  const certNo = `${REG_PREFIX}-CERT-${String(s.regNo||'').replace(/\D/g,'').slice(-4) || '0000'}`;
  const w = window.open('', '_blank', 'width=920,height=700');
  if (!w) { alert('Please allow pop-ups to print this document.'); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>Certificate - ${esc(s.name)}</title><meta charset="UTF-8">
  <style>${CERT_PRINT_CSS}</style></head><body>
    ${certificateHtml(s, tpl, bodyText, certNo)}
    <script>setTimeout(()=>{window.focus();window.print();},250)<\/script>
  </body></html>`);
  w.document.close();
}

/* ---------- Boot ---------- */
init();
</script>
</body>
</html>
